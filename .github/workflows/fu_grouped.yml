name: Follow-ups grouped message

# Plan leads' grouped Hot Leads messages (Koya HQ, 6 Nov 2026: ~75 per-lead pings a day was too many). Every 30 minutes on working days
# (09:00 to 17:00 Lagos) this asks Koya HQ which grouped messages are due (the 09:00 per-SDR summary, and in hourly mode the list for the hour)
# and posts each one to Hot Leads. Koya HQ hands each message out once and returns nothing while its ping mode is per-lead (the default), so
# this job posts nothing until the owner switches the mode in HQ. test=true posts what would go out now to the TEST channel only.
on:
  schedule:
    - cron: "2,32 8-15 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "true = post to the TEST channel"
        default: "true"

permissions: {}

concurrency:
  group: fu-grouped
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_URL: ${{ secrets.HOT_LEADS_WEBHOOK_URL }}
      TEST_URL: ${{ secrets.TEST_WEBHOOK_URL }}
      HOOK: ${{ secrets.LEAD_ACTIONS_HOOK }}
      TEST: ${{ github.event.inputs.test || 'false' }}
    steps:
      - name: Ask Koya HQ and post
        run: |
          python3 - <<'PY'
          import os, re, json, time, urllib.request, urllib.error, urllib.parse
          test = os.environ.get("TEST") == "true"
          q = urllib.parse.urlencode({"k": os.environ["HOOK"], "test": "1" if test else "0"})
          try:
              got = json.loads(urllib.request.urlopen("https://hq.koyatalent.com/hook/fugroup?" + q, timeout=60).read().decode() or "{}")
          except urllib.error.HTTPError as e:
              raise SystemExit(f"Koya HQ answered {e.code}")
          msgs = got.get("messages") or []
          print("mode", got.get("mode"), "messages", len(msgs))
          url = os.environ["TEST_URL" if test else "LIVE_URL"]
          bad = 0
          for m in msgs:
              pl = {"content": str(m.get("text", ""))[:1900], "username": "Koya follow-ups" + (" (TEST)" if test else ""), "allowed_mentions": {"parse": []}}
              if not test and re.fullmatch(r"\d{15,22}", str(m.get("mention") or "")): pl["allowed_mentions"]["users"] = [str(m["mention"])]   # only the SDR the message is for
              body = json.dumps(pl).encode()
              for i in range(5):
                  try:
                      req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json", "User-Agent": "DiscordBot (https://koya.dev, 1.0)"})
                      urllib.request.urlopen(req, timeout=30); break
                  except urllib.error.HTTPError as e:
                      if e.code != 429 and e.code < 500: bad += 1; print("Discord answered", e.code); break
                      time.sleep(3 * (i + 1))
                  except Exception as e:
                      time.sleep(3 * (i + 1))
              else:
                  bad += 1
              time.sleep(1)
          raise SystemExit(1 if bad else 0)
          PY
