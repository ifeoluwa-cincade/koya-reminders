name: Call list labels

# A person added to (or removed from) an Attio call list gets (or loses) the matching CloudTalk tag, which fills (or empties) the dialler campaign.
# Starts the moment the Attio webhook reports a change (via the Apps Script relay), and once an hour from the routine push as a safety net.
# workflow_dispatch defaults to a DRY RUN that changes nothing. The script prints COUNTS ONLY (public repo).
on:
  push:
    branches: [crm-trigger]
  repository_dispatch:
    types: [calllist_changed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = show counts, write nothing"
        default: "true"

permissions: {}

# CloudTalk allows 60 calls a minute for the WHOLE company. The hourly routine push starts every hourly job in the same second,
# so on that push only this job first waits 4 minutes (after Call dispositions and the start of the Dashboard build, before the CRM sync at 10).
# The wait is its own job with no concurrency group, so a call-list change that arrives meanwhile is never held up by it.
# The concurrency group sits on the real job: two label runs still never overlap.
jobs:
  stagger:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait 4 minutes so the hourly jobs do not all call CloudTalk at once
        run: sleep 240

  label:
    needs: stagger
    if: ${{ !cancelled() && needs.stagger.result != 'failure' }}
    concurrency:
      group: calllist-label
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATTIO_KEY_VAR: ATTIO_API_KEY_2
      ATTIO_API_KEY_2: ${{ secrets.ATTIO_API_KEY_2 }}
      CLOUD_TALK_API_KEY_ID: ${{ secrets.CLOUD_TALK_API_KEY_ID }}
      CLOUD_TALK_API_KEY: ${{ secrets.CLOUD_TALK_API_KEY }}
      TEST_WEBHOOK_URL: ${{ secrets.TEST_WEBHOOK_URL }}   # Captain Hook TEST channel: alerts go here for now
      DRY: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests phonenumbers
      - name: Give a burst of list changes a moment to settle
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: sleep 45
      - name: Label the call list people in CloudTalk
        run: |
          # a manual run with dry_run=true changes nothing; every automatic run is real
          if [ "$DRY" = "true" ]; then FLAG=""; echo "DRY RUN: nothing will be written"; else FLAG="--commit"; echo "REAL RUN"; fi
          python crm/scripts/calllist_to_cloudtalk.py $FLAG
