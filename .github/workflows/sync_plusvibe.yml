name: Sync PlusVibe to the CRM

# Once a day: copy what PlusVibe knows into the CRM, so the "last emailed" date and the 90-day "due again" date are right.
# It sets the last-contact date and campaign for everyone emailed, holds bounced addresses, moves people to Lost or Engaged from
# their reply label, and updates each campaign list. It never creates a person, and it never overwrites customers, lost deals
# or people already in conversation. A manual run defaults to a DRY RUN that changes nothing.
on:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [crm-trigger]      # the hourly routine push; only the 05 UTC hour counts (see the job condition)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report only, change nothing"
        default: "true"
      attempt:
        description: "set by the job itself when it resumes a run that ran out of time (leave 0)"
        default: "0"
      stop_after_campaigns:
        description: "test only: stop after pulling this many campaigns (the next run must resume and plan the same writes)"
        default: ""

permissions: {}

jobs:
  # The hourly routine push lands on crm-trigger. The sync itself must run on MAIN: its resume checkpoint lives in a
  # GitHub cache, and caches are per branch (a crm-trigger run would resume from, and save to, a different memory).
  handoff:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.timestamp, 'T05:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the daily sync on main
        run: gh workflow run sync_plusvibe.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run=false

  sync:
    if: ${{ github.event_name != 'push' }}
    concurrency:            # on the job, so the hourly pushes that do nothing never queue in front of a resume run
      group: sync-plusvibe
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the script stops itself at 40 min with a checkpoint and the job starts a resume run (see below)
    permissions:
      actions: write      # only to start the resume run
    env:
      ATTIO_KEY_VAR: ATTIO_API_KEY_2
      ATTIO_API_KEY_2: ${{ secrets.ATTIO_API_KEY_2 }}
      PLUS_VIBE_API_KEY: ${{ secrets.PLUS_VIBE_API_KEY }}
      ENC_CACHE_KEY: ${{ secrets.ENC_CACHE_KEY }}
      DRY: ${{ github.event.inputs.dry_run }}
      ATTEMPT: ${{ github.event.inputs.attempt || '0' }}
      SYNC_PV_TIME_BUDGET_MIN: "40"
      SYNC_PV_STOP_AFTER_CAMPAIGNS: ${{ github.event.inputs.stop_after_campaigns }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pyyaml
      # The checkpoint holds lead emails, so it is encrypted before GitHub stores it (same key as the phone lookup memory).
      - name: Restore the encrypted resume checkpoint
        uses: actions/cache/restore@v4
        with:
          path: data/caches/sync_plusvibe_checkpoint.json.enc
          key: sync-pv-ckpt-enc-${{ github.run_id }}
          restore-keys: sync-pv-ckpt-enc-
      - name: Decrypt it
        run: |
          if [ -f data/caches/sync_plusvibe_checkpoint.json.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/caches/sync_plusvibe_checkpoint.json.enc -out data/caches/sync_plusvibe_checkpoint.json -pass env:ENC_CACHE_KEY || rm -f data/caches/sync_plusvibe_checkpoint.json
            rm -f data/caches/sync_plusvibe_checkpoint.json.enc
          fi
      - name: Sync
        id: sync
        run: |
          set +e
          if [ "$DRY" = "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then python crm/scripts/sync_plusvibe.py; else python crm/scripts/sync_plusvibe.py --commit; fi
          rc=$?
          if [ $rc -eq 75 ]; then echo "resume=1" >> "$GITHUB_OUTPUT"; fi
          exit $rc
      - name: Encrypt the checkpoint again
        if: ${{ always() }}
        run: |
          # a run that finished deletes its checkpoint; then an empty marker is saved so the next run cannot pick up an older one
          mkdir -p data/caches
          if [ -f data/caches/sync_plusvibe_checkpoint.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in data/caches/sync_plusvibe_checkpoint.json -out data/caches/sync_plusvibe_checkpoint.json.enc -pass env:ENC_CACHE_KEY
          else
            echo '{}' | openssl enc -aes-256-cbc -pbkdf2 -salt -out data/caches/sync_plusvibe_checkpoint.json.enc -pass env:ENC_CACHE_KEY
          fi
      - name: Save the checkpoint (main only)
        if: ${{ always() && github.ref == 'refs/heads/main' && hashFiles('data/caches/sync_plusvibe_checkpoint.json.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/caches/sync_plusvibe_checkpoint.json.enc
          key: sync-pv-ckpt-enc-${{ github.run_id }}
      # Ran out of time on purpose (exit 75, checkpoint saved): start the next run on main at once, which resumes. At most 3 in a row.
      - name: Start the resume run
        if: ${{ failure() && steps.sync.outputs.resume == '1' && github.ref == 'refs/heads/main' && env.ATTEMPT < 3 }}
        run: |
          gh workflow run sync_plusvibe.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run="${DRY:-false}" -f attempt=$((ATTEMPT + 1))
          echo "resume run started (attempt $((ATTEMPT + 1)))"
      - name: Remove the temporary files that held lead details
        if: ${{ always() }}
        run: rm -rf data
