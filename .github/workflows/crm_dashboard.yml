name: Dashboard build

# Builds the Koya Outbound dashboard page: email numbers, call counts, opportunities, email threads and the health checks of every automation.
# The page contains real lead details, so it is NEVER stored in this public repository. It is pushed to a separate PRIVATE repository
# (the "dashboard-build" branch there) with a key that can write to that one repository only. A routine in claude.ai then publishes it.
# Runs every hour at 5 minutes past, so a fresh page is ready before the publishing routine runs at 20 past. It can also be started by hand. A manual run with test=true writes to a test branch and leaves the live page alone.
on:
  push:
    branches: [crm-trigger]      # the hourly routine in claude.ai pushes here: GitHub's own timer is unreliable
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "true = save to a test branch in the private repository, not the live one"
        default: "true"

permissions:
  actions: read

# The concurrency group sits on the build job (not the whole workflow) so the cheap hand-over job below never waits behind a build.
jobs:
  # The hourly routine pushes to the crm-trigger branch. A build on that branch reads the caches of THAT branch first (GitHub scopes caches
  # per branch and prefers the current branch's), so it could restore an old "call-state-enc-*" memory saved on crm-trigger and count calls
  # from stale data. So the push only starts the same build on main (which reads and shares main's newest cache), like Call dispositions does.
  # The build never SAVES a call-state cache (it restores read-only), so main stays the only writer and nothing is looked up twice.
  handoff:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    concurrency:
      group: dashboard-build-handoff
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the dashboard build on main
        run: |
          gh workflow run crm_dashboard.yml -R "$GITHUB_REPOSITORY" --ref main -f test=false
          echo "started the hourly build on main"

  build:
    if: ${{ github.event_name != 'push' }}
    concurrency:
      group: dashboard-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLUS_VIBE_API_KEY: ${{ secrets.PLUS_VIBE_API_KEY }}
      CLOUD_TALK_API_KEY_ID: ${{ secrets.CLOUD_TALK_API_KEY_ID }}
      CLOUD_TALK_API_KEY: ${{ secrets.CLOUD_TALK_API_KEY }}
      ATTIO_KEY_VAR: ATTIO_API_KEY_2
      ATTIO_API_KEY_2: ${{ secrets.ATTIO_API_KEY_2 }}
      LEAD_ACTIONS_URL: ${{ secrets.LEAD_ACTIONS_URL }}
      LEAD_ACTIONS_HOOK: ${{ secrets.LEAD_ACTIONS_HOOK }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      ARTIFACT_URL: ${{ secrets.ARTIFACT_URL }}
      ENC_CACHE_KEY: ${{ secrets.ENC_CACHE_KEY }}
      CALL_DATA_DIR: data/working/live
      GH_TOKEN: ${{ github.token }}
      PRIVATE_STORE_REPO: ${{ secrets.PRIVATE_STORE_REPO }}
      TEST: ${{ github.event.inputs.test }}
      PYTHONUNBUFFERED: "1"
      CT_LINK_CACHE: data/working/cloudtalk_link_cache.json   # which leads are which CloudTalk contact: kept between runs in the private store
      CT_FIRST_CALLS: data/working/cloudtalk_first_calls.json # the first outgoing call to each number (a lead's first touch): kept the same way
      CT_WAIT_BUDGET: "180"                                   # seconds this build may wait for CloudTalk's shared limit; then the rest waits for the next build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Tell the team app a build has started (for its Refresh button; counts only)
        if: ${{ env.TEST != 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crm/scripts/job_status.py set dashboard --phase building --text "Rebuilding numbers"
      - name: Set up the key for the private repository
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/store_key && chmod 600 ~/.ssh/store_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/store_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          if [ "$TEST" = "true" ]; then echo "TARGET_BRANCH=dashboard-build-test" >> "$GITHUB_ENV"; else echo "TARGET_BRANCH=dashboard-build" >> "$GITHUB_ENV"; fi
      # The memory of finished calls is encrypted. It is only read here, to count calls and to see which are still waiting.
      - name: Restore the encrypted memory of finished calls (read only)
        uses: actions/cache/restore@v4
        with:
          path: data/working/live/live_state.json.enc
          key: call-state-enc-none
          restore-keys: call-state-enc-
      - name: Decrypt it
        run: |
          mkdir -p data/working/live
          if [ -f data/working/live/live_state.json.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/working/live/live_state.json.enc -out data/working/live/live_state.json -pass env:ENC_CACHE_KEY || rm -f data/working/live/live_state.json
          fi
      - name: Count the calls for the dashboard
        continue-on-error: true
        run: python crm/dashboard/export_call_outcomes.py
      - name: Pull PlusVibe numbers
        run: python crm/scripts/collect_metrics.py --days 40 --plusvibe-only
      - name: Restore the health-check history from the private repository
        id: restore
        continue-on-error: true
        run: |
          rm -rf /tmp/store && mkdir /tmp/store && cd /tmp/store && git init -q
          git remote add origin "git@github.com:${PRIVATE_STORE_REPO}.git"
          # RESTORE_OK=1 only when the private repository answered. If it could not be read, the save step below is skipped: saving a build
          # made without the history would force-push over check_history.json and cloudtalk_link_cache.json and wipe them.
          if git fetch -q --depth 1 origin dashboard-build; then
            echo "RESTORE_OK=1" >> "$GITHUB_ENV"
          elif git ls-remote --exit-code --heads origin dashboard-build >/dev/null 2>&1; then
            echo "the private repository has the branch but it could not be fetched"; exit 1
          elif git ls-remote origin >/dev/null 2>&1; then
            echo "private repository reachable, branch not created yet (first run)"; echo "RESTORE_OK=1" >> "$GITHUB_ENV"; exit 0
          else
            echo "the private repository could not be reached"; exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/data/working"
          git show FETCH_HEAD:check_history.json > "$GITHUB_WORKSPACE/data/working/check_history.json" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/data/working/check_history.json"
          git show FETCH_HEAD:ops_last_good.json > "$GITHUB_WORKSPACE/data/working/ops_last_good.json" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/data/working/ops_last_good.json"
          git show FETCH_HEAD:cloudtalk_link_cache.json > "$GITHUB_WORKSPACE/data/working/cloudtalk_link_cache.json" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/data/working/cloudtalk_link_cache.json"
          git show FETCH_HEAD:cloudtalk_first_calls.json > "$GITHUB_WORKSPACE/data/working/cloudtalk_first_calls.json" 2>/dev/null || rm -f "$GITHUB_WORKSPACE/data/working/cloudtalk_first_calls.json"
      - name: Collect opportunities and system checks
        continue-on-error: true
        run: python crm/dashboard/collect_ops.py
      - name: Build the page
        run: python crm/dashboard/build_cold_email.py
      - name: Upload the page to the team app (private storage, never this repository)
        id: upload
        if: ${{ env.TEST != 'true' }}
        continue-on-error: true       # so the save to the private repository below still happens; the failure is raised at the end ("Fail the run if...")
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS --fail-with-body -o /dev/null -X POST "$SUPABASE_URL/storage/v1/object/dashboard/koya_cold_email.html" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: text/html" -H "x-upsert: true" --data-binary @data/working/koya_cold_email.html
          echo "page uploaded to the team app"
      - name: Save the built page in the private repository
        if: ${{ env.RESTORE_OK == '1' }}
        run: |
          set -e
          rm -rf /tmp/out && mkdir /tmp/out
          cp data/working/koya_cold_email.html /tmp/out/koya_cold_email.html
          [ -f data/working/check_history.json ] && cp data/working/check_history.json /tmp/out/check_history.json || true
          [ -f data/working/cloudtalk_link_cache.json ] && cp data/working/cloudtalk_link_cache.json /tmp/out/cloudtalk_link_cache.json || true
          [ -f data/working/cloudtalk_first_calls.json ] && cp data/working/cloudtalk_first_calls.json /tmp/out/cloudtalk_first_calls.json || true
          # keep the last list that was read properly, so one bad hour never blanks the Opportunities tab
          python3 - <<'PY'
          import json, shutil, os
          W = "data/working/"
          try:
              ops = json.load(open(W + "ops.json"))
          except Exception:
              ops = {}
          if ops.get("opps") and not ops.get("errors"):
              json.dump({"opps": ops["opps"], "ops_at": ops.get("generated_at")}, open("/tmp/out/ops_last_good.json", "w"))
          elif os.path.exists(W + "ops_last_good.json"):
              shutil.copy(W + "ops_last_good.json", "/tmp/out/ops_last_good.json")
          PY
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/out/built_at.txt
          cd /tmp/out
          git init -q -b "$TARGET_BRANCH"
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Dashboard build $(cat built_at.txt)"
          git push -q --force "git@github.com:${PRIVATE_STORE_REPO}.git" "$TARGET_BRANCH"
          echo "saved to branch $TARGET_BRANCH in the private repository"
      - name: Fail the run if the history could not be restored or the upload failed
        if: ${{ env.RESTORE_OK != '1' || steps.upload.outcome == 'failure' }}
        run: |
          [ "$RESTORE_OK" != "1" ] && echo "::error::History could not be restored from the private repository: the page was NOT saved there (nothing was overwritten)."
          [ "${{ steps.upload.outcome }}" = "failure" ] && echo "::error::The page was NOT uploaded to the team app."
          exit 1
      - name: Tell the team app how the build ended
        if: ${{ always() && env.TEST != 'true' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python crm/scripts/job_status.py set dashboard --phase finished --finished \
            --result "$( [ '${{ job.status }}' = 'success' ] && echo ok || echo failed )" --text "Finished (${{ job.status }})"
      - name: Remove everything that held lead details
        if: ${{ always() }}
        run: |
          rm -rf /tmp/out /tmp/store data/working ~/.ssh/store_key
