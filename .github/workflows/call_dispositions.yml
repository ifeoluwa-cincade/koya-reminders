name: Call dispositions

# New CloudTalk calls get an outcome worked out from the call itself (nobody clicks anything), then the outcome is written to the CRM:
#   1. live_call_dispositions.py  - no answer / voicemail by talk time, otherwise a transcript and a verdict
#   2. apply_call_verdicts.py     - a note per call on the person, and their stage only where the call is the strongest signal; a "not interested" call also stops their PlusVibe emails
#   3. calls_to_call_lists.py     - the dialler queue stops re-ringing people who already answered
# Starts within minutes of a call (the CloudTalk note that lands in Attio fires a webhook -> relay -> call_note), runs every hour from the routine push as a safety net,
# keeps its morning and evening timers, and can be started by hand. (Ife 2026-10-12: it used to run only at 08 and 20 UTC to save GitHub minutes; the public repo has no such limit.)
# Calls already handled are remembered, so a run only works on new calls. A manual run defaults to a DRY RUN.
on:
  push:
    branches: [crm-trigger]      # the hourly routine in claude.ai pushes here: GitHub's own timer is unreliable
  repository_dispatch:
    types: [call_note]
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report what would happen, no transcripts and no CRM writes"
        default: "true"
      recheck:
        description: "a number N: also put the last N real-conversation calls through the fast Attio writers again (their notes already exist, so nothing is duplicated; it proves the lookups)"
        default: "0"

permissions: {}

concurrency:
  group: call-dispositions
  cancel-in-progress: false

jobs:
  dispositions:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # 16 Oct: listing 3 days of CloudTalk calls can take ~17 min under the shared rate limit; 25 min left no time to transcribe
    env:
      CALL_DATA_DIR: data/working/live
      ATTIO_KEY_VAR: ATTIO_API_KEY_2
      ATTIO_API_KEY_2: ${{ secrets.ATTIO_API_KEY_2 }}
      CLOUD_TALK_API_KEY_ID: ${{ secrets.CLOUD_TALK_API_KEY_ID }}
      CLOUD_TALK_API_KEY: ${{ secrets.CLOUD_TALK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ENC_CACHE_KEY: ${{ secrets.ENC_CACHE_KEY }}
      PLUS_VIBE_API_KEY: ${{ secrets.PLUS_VIBE_API_KEY }}     # a not-interested call stops the lead's PlusVibe emails (apply_call_verdicts.py)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                       # Call review: the team app's database and its PRIVATE call-audio bucket
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRANSCRIBER: groq                                               # Call review transcripts; "deepgram" (diarized) needs DEEPGRAM_API_KEY and Ife's yes
      DRY: ${{ github.event.inputs.dry_run }}
      RECHECK: ${{ github.event.inputs.recheck }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          pip install requests pyyaml
          npm install -g @anthropic-ai/claude-code
      - name: Give the recording a moment to be ready
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: sleep 12
      - name: Decide dry run or real run
        run: |
          # a manual run with dry_run=true changes nothing; every automatic run is real
          if [ "$DRY" = "true" ]; then echo "COMMIT=" >> "$GITHUB_ENV"; echo "DRY=true" >> "$GITHUB_ENV"; echo "DRY RUN: nothing will be written"; else echo "COMMIT=--commit" >> "$GITHUB_ENV"; echo "DRY=false" >> "$GITHUB_ENV"; echo "REAL RUN"; fi
          # Look back 3 days, but never before 11 Oct 2026: calls up to then were handled by the old job, so they must not be redone.
          echo "SINCE=$(python3 -c "import datetime as d; print(max(d.date(2026,10,11), d.date.today()-d.timedelta(days=3)).isoformat())")" >> "$GITHUB_ENV"
      # The memory of which calls are done holds what was said on calls, so it is encrypted before GitHub stores it.
      - name: Restore the encrypted memory of finished calls
        uses: actions/cache@v4
        with:
          # ONE path only: the cache version includes the path list, so adding a file here hides every earlier
          # copy of the memory (that happened on 16 Oct: every run redid 1,000 calls and was cancelled).
          path: data/working/live/live_state.json.enc
          key: call-state-enc-${{ github.run_id }}
          restore-keys: call-state-enc-
      - name: Restore the Call review skip list (its own cache, so the call memory above keeps its key)
        uses: actions/cache@v4
        with:
          path: data/working/live/review_skip.json.enc
          key: review-skip-enc-${{ github.run_id }}
          restore-keys: review-skip-enc-
      - name: Decrypt it
        run: |
          mkdir -p data/working/live
          if [ -f data/working/live/live_state.json.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/working/live/live_state.json.enc -out data/working/live/live_state.json -pass env:ENC_CACHE_KEY || rm -f data/working/live/live_state.json
          fi
          if [ -f data/working/live/review_skip.json.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/working/live/review_skip.json.enc -out data/working/live/review_skip.json -pass env:ENC_CACHE_KEY || rm -f data/working/live/review_skip.json
          fi
      - name: Work out an outcome for every new call
        run: python crm/scripts/live_call_dispositions.py --since "$SINCE" $COMMIT
      - name: Put the last few real calls through the fast writers again (manual check)
        if: ${{ env.DRY != 'true' && github.event.inputs.recheck != '' && github.event.inputs.recheck != '0' }}
        run: |
          python - <<'PY'
          import json, os
          f = "data/working/live/live_state.json"
          st = json.load(open(f)); n = int(os.environ["RECHECK"])
          real = sorted([c for c, r in st.items() if isinstance(r, dict) and r.get("verdict") in ("MEETING_BOOKED","SEND_FOLLOW_UP","CALLBACK","NOT_NOW","NOT_INTERESTED","WRONG_PERSON","DO_NOT_CALL")], key=lambda c: st[c].get("started") or "")[-n:]
          for c in real: st[c]["applied_a"] = False; st[c]["applied_l"] = False
          json.dump(st, open(f, "w"), indent=1); print("re-queued", len(real), "calls")
          PY
      - name: Write the outcomes onto the people in the CRM
        if: ${{ env.DRY != 'true' }}
        run: python crm/scripts/apply_call_verdicts.py --commit
      - name: Put the outcomes back on the call-list queue
        if: ${{ env.DRY != 'true' }}
        run: python crm/scripts/calls_to_call_lists.py --commit
      # Call review (the team app's Call review page): real conversations of 45 s or more get their audio copied once into the
      # private call-audio bucket, a transcript with times, and a short breakdown. Logs show counts only (public repo).
      # It runs after the CRM writers and never stops them; a failure here only delays a review to the next run.
      - name: Make call reviews for real conversations
        if: ${{ env.DRY != 'true' }}
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          python crm/scripts/call_review.py --since "$SINCE" --limit 40 --commit
      - name: Encrypt the memory again
        if: ${{ always() }}
        run: |
          if [ -f data/working/live/live_state.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in data/working/live/live_state.json -out data/working/live/live_state.json.enc -pass env:ENC_CACHE_KEY
          fi
          if [ -f data/working/live/review_skip.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in data/working/live/review_skip.json -out data/working/live/review_skip.json.enc -pass env:ENC_CACHE_KEY
          fi
          rm -rf data/working/live/*.json
