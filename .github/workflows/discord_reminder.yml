name: Discord reminder

# Posts one follow-up reminder to Discord when the Koya Outbound reminder script asks for it
# (repository_dispatch, event discord_reminder). It then writes the result to the dashboard's activity log.
# test=true posts to the TEST channel only. The job exits with an error if Discord never accepts the message,
# so a failed delivery is never reported as delivered.
on:
  repository_dispatch:
    types: [discord_reminder]
  workflow_dispatch:
    inputs:
      message:
        description: "Test only: the text to post"
        default: "Test reminder (nothing to do)"
      test:
        description: "true = post to the TEST channel"
        default: "true"
      channel:
        description: "system = post to the Systems and ops channel"
        default: ""

permissions: {}

concurrency:
  group: discord-reminder-${{ github.run_id }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_URL: ${{ secrets.HOT_LEADS_WEBHOOK_URL }}
      TEST_URL: ${{ secrets.TEST_WEBHOOK_URL }}
      SYSTEM_URL: ${{ secrets.SYSTEM_WEBHOOK_URL }}
      CHANNEL: ${{ github.event.client_payload.channel || github.event.inputs.channel }}
      LEAD_ACTIONS_URL: ${{ secrets.LEAD_ACTIONS_URL }}
      LEAD_ACTIONS_HOOK: ${{ secrets.LEAD_ACTIONS_HOOK }}
      MESSAGE: ${{ github.event.client_payload.message || github.event.inputs.message }}
      LABEL: ${{ github.event.client_payload.label || 'reminder' }}
      LEAD: ${{ github.event.client_payload.lead }}
      TEST: ${{ github.event.client_payload.test || github.event.inputs.test }}
    steps:
      # "Already posted" memory (2026-10-17): the same reminder delivered twice (a GitHub re-run, or the relay sending the same
      # dispatch again) is posted once. Key = the event id when the sender gives one, else a keyed hash of the message, lead,
      # label, channel and UTC day (HMAC with ENC_CACHE_KEY, so the public cache key reveals nothing). A manual test run is keyed on
      # its own run id, so every new test still posts. The marker is an empty GitHub cache entry under that key.
      - name: Work out this reminder's id
        id: key
        env:
          ENC_CACHE_KEY: ${{ secrets.ENC_CACHE_KEY }}
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
        run: |
          python3 - <<'PY'
          import os, hmac, hashlib, time
          parts = [os.environ.get("EVENT_ID") or "", os.environ.get("MANUAL") or ""]
          if not any(parts):
              parts = [os.environ.get(k, "") for k in ("MESSAGE", "LEAD", "LABEL", "CHANNEL", "TEST")] + [time.strftime("%Y-%m-%d", time.gmtime())]
          k = hmac.new(os.environ["ENC_CACHE_KEY"].encode(), "\x1f".join(parts).encode(), hashlib.sha256).hexdigest()[:24]
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"id={k}\n")
          PY
      - name: Already posted?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: posted.marker
          key: discord-posted-${{ steps.key.outputs.id }}
          lookup-only: true
      - name: Already posted, not sending again
        if: ${{ steps.seen.outputs.cache-hit == 'true' }}
        run: echo "this reminder was already posted, same id, so it is not sent twice"
      - name: Post to Discord (up to 5 tries)
        if: ${{ steps.seen.outputs.cache-hit != 'true' }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error, urllib.parse
          test = os.environ.get("TEST") == "true"
          system = os.environ.get("CHANNEL") == "system" and not test      # system alerts never go to the Hot Leads channel
          url = os.environ["SYSTEM_URL" if system else ("TEST_URL" if test else "LIVE_URL")]
          msg = os.environ.get("MESSAGE", "").strip()
          if not msg:
              raise SystemExit("no message to post")
          def post():
              req = urllib.request.Request(url, data=json.dumps({"content": msg, "username": "Koya systems" if system else "Koya follow-ups" + (" (TEST)" if test else "")}).encode(),
                                           headers={"Content-Type": "application/json", "User-Agent": "DiscordBot (https://koya.dev, 1.0)"})
              return urllib.request.urlopen(req, timeout=30).status
          result, err = None, ""
          for i in range(5):
              try:
                  result = post(); break
              except urllib.error.HTTPError as e:
                  err = f"Discord answered {e.code}"
                  if e.code not in (429,) and e.code < 500: break
                  time.sleep(3 * (i + 1))
              except Exception as e:
                  err = type(e).__name__; time.sleep(3 * (i + 1))
          ok = result is not None and result < 300
          where = "the Systems channel" if system else ("the TEST channel" if test else "Hot Leads")
          kind, text, level = ("reminder" if not system else "heal", f"Reminder posted in {where} from GitHub", "info") if ok else ("error", f"GitHub could not post to {where}: {err}", "bad")
          if test: text = "[TEST] " + text
          label = os.environ.get("LABEL", "")
          try:
              if not ok or label in ("reminder", "test"):
                  q = urllib.parse.urlencode({"logact": os.environ["LEAD_ACTIONS_HOOK"], "kind": kind, "text": text, "lead": os.environ.get("LEAD", ""), "level": level})
                  urllib.request.urlopen(os.environ["LEAD_ACTIONS_URL"] + "?" + q, timeout=60).read()
          except Exception as e:
              print("could not write to the activity log:", type(e).__name__)
          print("posted" if ok else "FAILED: " + err)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Remember it was posted
        if: ${{ success() && steps.seen.outputs.cache-hit != 'true' }}
        run: touch posted.marker
      - name: Save the posted marker
        if: ${{ success() && steps.seen.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: posted.marker
          key: discord-posted-${{ steps.key.outputs.id }}
