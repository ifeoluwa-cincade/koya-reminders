name: CRM daily

# Once a day: make sure everyone on a CRM call list carries the matching tag in the dialler, which is what puts them in its campaign.
# Writes are read back and retried, because the dialler's tag endpoint answers OK and sometimes does not save.
# A manual run defaults to a DRY RUN.
on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report only, change nothing"
        default: "true"

permissions: {}

concurrency:
  group: crm-daily
  cancel-in-progress: false

jobs:
  # Koya HQ's hourly clock starts this job on time (workflow_dispatch, koya-app lib/clockjobs.js, 27 Nov 2026). GitHub's timer stays as
  # the fallback; a timer run steps aside when a run started in the last 1200 min (tools/skip_if_recent.py). Manual/HQ runs always run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: g
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/skip_if_recent.py --window 1200
  queues:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATTIO_KEY_VAR: ATTIO_API_KEY_2
      ATTIO_API_KEY_2: ${{ secrets.ATTIO_API_KEY_2 }}
      CLOUD_TALK_API_KEY_ID: ${{ secrets.CLOUD_TALK_API_KEY_ID }}
      CLOUD_TALK_API_KEY: ${{ secrets.CLOUD_TALK_API_KEY }}
      DRY: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Call lists to dialler tags
        run: |
          if [ "$DRY" = "true" ]; then python crm/scripts/verify_cloudtalk_tags.py; else python crm/scripts/verify_cloudtalk_tags.py --commit; fi
      - name: Merge the empty duplicate people CloudTalk creates (notes move to the real person first)
        continue-on-error: true
        run: |
          if [ "$DRY" = "true" ]; then python crm/scripts/merge_cloudtalk_twins.py --days 3; else python crm/scripts/merge_cloudtalk_twins.py --commit --days 3; fi
      # The stop-only safety net that lived here moved to stage_sync.yml (hourly, Later included, fills missing tags) on 20 Nov 2026.
