name: PlusVibe positive-reply phone lookup

# Finds a phone number for each new positive PlusVibe reply and adds it to the call-list sheet.
# Starts the instant a real reply arrives (repository_dispatch from the Apps Script relay) and four times a day as a safety net.
# What was already handled is remembered in the Google Sheet itself, so a repeat run never double-posts.
on:
  push:
    branches: [crm-trigger]      # the hourly routine in claude.ai pushes here: GitHub's own timer is unreliable
  repository_dispatch:
    types: [plusvibe_reply]
  schedule:
    - cron: "17 7,11,15,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = show who would be looked up; no paid lookups, nothing written or posted"
        default: "true"

permissions: {}

jobs:
  # The hourly push lands on crm-trigger; the lookup runs on MAIN so its paid-lookup memory (a GitHub cache, per branch) is one memory.
  handoff:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the lookup on main
        run: gh workflow run plusvibe_phone_lookup.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run=false

  lookup:
    if: ${{ github.event_name != 'push' }}
    concurrency:
      group: plusvibe-phone-lookup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install gspread google-auth requests
      # What was paid for is remembered before the sheet row is written. It holds phone numbers, so it is encrypted.
      - name: Restore the encrypted lookup memory
        uses: actions/cache/restore@v4
        with:
          path: data/caches/pv_phone_lookup_memory.json.enc
          key: pv-phone-lookup-enc-${{ github.run_id }}
          restore-keys: pv-phone-lookup-enc-
      - name: Decrypt it
        env:
          ENC_CACHE_KEY: ${{ secrets.ENC_CACHE_KEY }}
        run: |
          if [ -f data/caches/pv_phone_lookup_memory.json.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in data/caches/pv_phone_lookup_memory.json.enc -out data/caches/pv_phone_lookup_memory.json -pass env:ENC_CACHE_KEY || { rm -f data/caches/pv_phone_lookup_memory.json; echo "::error::lookup memory could not be decrypted: not looking anything up"; exit 1; }
          fi
      - name: Run phone lookup
        env:
          PLUS_VIBE_API_KEY: ${{ secrets.PLUS_VIBE_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          AI_ARK_KEY_2: ${{ secrets.AI_ARK_KEY_2 }}
          SALES_QL_API_KEY: ${{ secrets.SALES_QL_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.PHONE_BOT_WEBHOOK_URL }}
          CALLLIST_SHEET_ID: ${{ secrets.CALLLIST_SHEET_ID }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          # off main a run is always a dry run: the lookup memory lives on main only
          if [ "$DRY" = "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then python automation/plusvibe_auto_phone_lookup.py --dry-run; else python automation/plusvibe_auto_phone_lookup.py; fi
      - name: Encrypt the lookup memory again
        if: ${{ always() }}
        env:
          ENC_CACHE_KEY: ${{ secrets.ENC_CACHE_KEY }}
        run: |
          if [ -f data/caches/pv_phone_lookup_memory.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -in data/caches/pv_phone_lookup_memory.json -out data/caches/pv_phone_lookup_memory.json.enc -pass env:ENC_CACHE_KEY
            rm -f data/caches/pv_phone_lookup_memory.json
          fi
      - name: Save the lookup memory, even when a step failed (main only)
        if: ${{ always() && github.ref == 'refs/heads/main' && hashFiles('data/caches/pv_phone_lookup_memory.json.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/caches/pv_phone_lookup_memory.json.enc
          key: pv-phone-lookup-enc-${{ github.run_id }}
